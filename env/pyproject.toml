[project]
name = "mahjong-env"
version = "0.1.0"
description = "Python bots for mahjong-showdown (a mahjong fork of Pokémon Showdown). Derived from poke-env."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mjsim",
    "requests>=2.32.3",
    "websockets>=15",
]

[tool.uv.sources]
mjsim = { path = "../sim", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mahjong_env"]

[project]
name = "mjsim"
version = "0.1.0"
description = "Japanese riichi mahjong simulator for mahjong-showdown (driven by JSON lines)"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mahjong>=2.0,<3"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mjsim"]
